project:
  type: website
  pre-render:
    - python3 contributors.py
website:
  title: ""
  navbar:      
    right:
      - icon: envelope-at-fill
        href: mailto:kidambi@duck.com
      - icon: github
        href:  https://github.com/cycluster
      - text: Zulip
        href: https://cycluster.zulipchat.com
      - icon: menu-button-wide
        menu:
          - text: Report a Bug
            href:  mailto:cycluster@mpim-bonn.mpg.de
  page-footer: 
    left: "Copyright 2025, CYCluster. Made with [Quarto](https://github.com/quarto-dev)." 
    center: "[Contributors](../contributors/)"
  page-navigation: true
  site-url: https://cycluster.github.io
  sidebar:
    contents:
      - section: "Documentation"
        contents:
          - text: AESZ (CY Operators)
            href: ../documentation/aesz/
