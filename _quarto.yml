format:

  html:
    math: katex  
    grid:
      sidebar-width: 300px
      body-width: 1200px
      margin-width: 300px
      gutter-width: 1.5rem  
    theme:
      light: cosmo 
    css: styles.css
    toc: true
    include-in-header:
      - text: |
          <link href="https://fonts.cdnfonts.com/css/tex-gyre-heros" rel="stylesheet">
      - text: |
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">


filters:
   - nutshell

brand: brand/_brand.yml

